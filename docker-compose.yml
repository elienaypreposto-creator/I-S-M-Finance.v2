version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ism_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      POSTGRES_DB: ismfinance
    ports:
      # Publicado só no loopback da VM: acessível por túnel SSH (DBeaver, psql),
      # nunca pela rede privada nem pela internet.
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ism_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    depends_on:
      - postgres
    environment:
      # Sobrescreve o DATABASE_URL para apontar para o contêiner interno do postgres
      - DATABASE_URL=postgresql://ism_user:${DB_PASSWORD:?Defina DB_PASSWORD no .env}@postgres:5432/ismfinance
      - PORT=5000
      - NODE_ENV=production
      - RUN_LOCAL=true
    env_file:
      - .env # Carrega os demais segredos como SMTP e JWT_SECRET
    # Sem porta publicada: o nginx do serviço "web" acessa api:5000 pela ism_network.
    networks:
      - ism_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    depends_on:
      - api
    ports:
      # Mantido em todas as interfaces: o proxy reverso da VM chega por 10.0.0.24:<WEB_PORT>.
      - "${WEB_PORT:-85}:80"
    networks:
      - ism_network

volumes:
  pgdata:
    driver: local

networks:
  ism_network:
    driver: bridge
  proxy-network:
    external: true
