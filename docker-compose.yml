version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ism_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ismfinance
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432" # Somente loopback; acesso externo via túnel SSH
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ism_network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    depends_on:
      - postgres
    environment:
      # API: ism_app / ism_admin / ism_owner. Superuser (ism_user) só no one-shot de migrate.
      - DATABASE_URL=postgresql://ism_app:${ISM_APP_PASSWORD:-${DB_PASSWORD}}@postgres:5432/ismfinance
      - DATABASE_ADMIN_URL=postgresql://ism_admin:${ISM_ADMIN_PASSWORD:-${DB_PASSWORD}}@postgres:5432/ismfinance
      - DATABASE_OWNER_URL=postgresql://ism_owner:${ISM_OWNER_PASSWORD:-${DB_PASSWORD}}@postgres:5432/ismfinance
      - ISM_APP_PASSWORD=${ISM_APP_PASSWORD:-${DB_PASSWORD}}
      - ISM_ADMIN_PASSWORD=${ISM_ADMIN_PASSWORD:-${DB_PASSWORD}}
      - ISM_OWNER_PASSWORD=${ISM_OWNER_PASSWORD:-${DB_PASSWORD}}
      - PORT=5000
      - NODE_ENV=production
      - RUN_LOCAL=true
    env_file:
      - .env # Carrega os demais segredos como SMTP e JWT_SECRET
    networks:
      - ism_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-85}:80" # O proxy reverso da VM acessa via 10.0.0.24:WEB_PORT
    networks:
      - ism_network

volumes:
  pgdata:
    driver: local

networks:
  ism_network:
    driver: bridge
  proxy-network:
    external: true
