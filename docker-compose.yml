version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ism_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ismfinance
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432" # Somente loopback; acesso externo via túnel SSH
    volumes:
      - ${PGDATA_MOUNT:-pgdata}:/var/lib/postgresql/data
    networks:
      - ism_network

  redis:
    image: redis:7-alpine
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    environment:
      # Só para o healthcheck; o redis-server recebe a senha pelo --requirepass acima.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - redis_network # rede interna (sem rota externa); sem "ports:" -> não publicado no host

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: always
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      # API: ism_app / ism_admin / ism_owner. Superuser (ism_user) só no one-shot de migrate.
      - DATABASE_URL=postgresql://ism_app:${ISM_APP_PASSWORD:-${DB_PASSWORD}}@postgres:5432/ismfinance
      - DATABASE_ADMIN_URL=postgresql://ism_admin:${ISM_ADMIN_PASSWORD:-${DB_PASSWORD}}@postgres:5432/ismfinance
      - DATABASE_OWNER_URL=postgresql://ism_owner:${ISM_OWNER_PASSWORD:-${DB_PASSWORD}}@postgres:5432/ismfinance
      - ISM_APP_PASSWORD=${ISM_APP_PASSWORD:-${DB_PASSWORD}}
      - ISM_ADMIN_PASSWORD=${ISM_ADMIN_PASSWORD:-${DB_PASSWORD}}
      - ISM_OWNER_PASSWORD=${ISM_OWNER_PASSWORD:-${DB_PASSWORD}}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}@redis:6379
      - PORT=5000
      - NODE_ENV=production
      - RUN_LOCAL=true
      - ISM_DISCO_CIFRADO=${ISM_DISCO_CIFRADO:-0}
    env_file:
      - .env # Carrega os demais segredos como SMTP e JWT_SECRET
    networks:
      - ism_network
      - redis_network

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-85}:80" # O proxy reverso da VM acessa via 10.0.0.24:WEB_PORT
    networks:
      - ism_network

volumes:
  pgdata:
    driver: local

networks:
  ism_network:
    driver: bridge
  redis_network:
    driver: bridge
    internal: true # sem saída para fora do Docker; só api e redis participam
  proxy-network:
    external: true