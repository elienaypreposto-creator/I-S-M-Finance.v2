        "201":
          description: Token criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /tokens-api/{id}:
    put:
      tags: [Tokens API]
      security: [{ bearerAuth: [] }]
