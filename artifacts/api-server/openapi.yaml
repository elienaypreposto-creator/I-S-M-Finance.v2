      responses:
        "200":
          description: Dias de atraso
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /dashboard/nivel-risco:
    get:
      tags: [Dashboard]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Nível de risco
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /dashboard/fluxo-caixa-mensal:
