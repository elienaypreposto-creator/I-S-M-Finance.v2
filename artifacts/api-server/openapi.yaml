openapi: 3.0.3
info:
  title: ISM Finance API
  version: 1.0.0
  description: API REST para controle financeiro, conciliação bancária e relatórios.
servers:
  - url: http://localhost:3000/api
    description: Local
tags:
  - name: Auth
  - name: Usuarios
  - name: Parceiros
  - name: Lancamentos
  - name: Contas Bancarias
  - name: Plano de Contas
  - name: Metas
  - name: Filiais
  - name: Departamentos
  - name: Conciliacoes
  - name: Dashboard
  - name: Relatorios
  - name: Kanban
  - name: Tokens API
  - name: Power BI V1
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: OK
  /auth/login:
    post:
      tags: [Auth]
      summary: Login com email e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, format: email }
                senha: { type: string }
      responses:
        "200":
          description: Login efetuado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeAuthLogin"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /auth/me:
    get:
      tags: [Auth]
      summary: Usuário autenticado + permissões
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuário atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeMe"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /usuarios:
    get:
      tags: [Usuarios]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Lista de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopePaginated"
    post:
      tags: [Usuarios]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCreateInput"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeGeneric"
  /usuarios/{id}:
    put:
      tags: [Usuarios]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopeGeneric"
  /usuarios/{id}/permissoes:
    get:
      tags: [Usuarios]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Permissões do usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopePermissions"
    put:
      tags: [Usuarios]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissoes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Permissões atualizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiEnvelopePermissions"
  /parceiros:
    get:
      tags: [Parceiros]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Lista de parceiros
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopePaginated" }
    post:
      tags: [Parceiros]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParceiroInput" }
      responses:
        "201":
          description: Parceiro criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /parceiros/{id}:
    get:
      tags: [Parceiros]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Parceiro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    put:
      tags: [Parceiros]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParceiroInput" }
      responses:
        "200":
          description: Parceiro atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    delete:
      tags: [Parceiros]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Parceiro removido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /lancamentos:
    get:
      tags: [Lancamentos]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
        - in: query
          name: tipo
          schema: { type: string, enum: [CP, CR] }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: conta_id
          schema: { type: integer }
        - in: query
          name: parceiro_id
          schema: { type: integer }
        - in: query
          name: data_inicio
          schema: { type: string, format: date }
        - in: query
          name: data_fim
          schema: { type: string, format: date }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Lista de lançamentos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopePaginated" }
    post:
      tags: [Lancamentos]
      security: [{ bearerAuth: [] }]
      description: Aplica preenchimento automático de departamento e centro de custo via parceiro quando esses campos não forem enviados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LancamentoInput" }
      responses:
        "201":
          description: Lançamento criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /lancamentos/{id}:
    get:
      tags: [Lancamentos]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Lançamento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    put:
      tags: [Lancamentos]
      security: [{ bearerAuth: [] }]
      description: Também aplica preenchimento automático por parceiro quando necessário.
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LancamentoInput" }
      responses:
        "200":
          description: Lançamento atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    delete:
      tags: [Lancamentos]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Lançamento removido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
        "403":
          $ref: "#/components/responses/ForbiddenError"
  /contas-bancarias:
    get:
      tags: [Contas Bancarias]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de contas bancárias
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    post:
      tags: [Contas Bancarias]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContaBancariaInput" }
      responses:
        "201":
          description: Conta criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /contas-bancarias/{id}:
    put:
      tags: [Contas Bancarias]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContaBancariaInput" }
      responses:
        "200":
          description: Conta atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    delete:
      tags: [Contas Bancarias]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Conta removida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /plano-contas:
    get:
      tags: [Plano de Contas]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de plano de contas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    post:
      tags: [Plano de Contas]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanoContaInput" }
      responses:
        "201":
          description: Plano de conta criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /plano-contas/{id}:
    put:
      tags: [Plano de Contas]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanoContaInput" }
      responses:
        "200":
          description: Plano atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    delete:
      tags: [Plano de Contas]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Plano removido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /metas:
    get:
      tags: [Metas]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: ano
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Metas por ano
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    post:
      tags: [Metas]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plano_conta_id, ano, mes, valor_projetado]
              properties:
                plano_conta_id: { type: integer }
                ano: { type: integer }
                mes: { type: integer, minimum: 1, maximum: 12 }
                valor_projetado: { type: number }
      responses:
        "200":
          description: Meta criada/atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /filiais:
    get:
      tags: [Filiais]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de filiais
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    post:
      tags: [Filiais]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string }
      responses:
        "201":
          description: Filial criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /filiais/{id}:
    put:
      tags: [Filiais]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
      responses:
        "200":
          description: Filial atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    delete:
      tags: [Filiais]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Filial removida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /departamentos:
    get:
      tags: [Departamentos]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de departamentos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    post:
      tags: [Departamentos]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome]
              properties:
                nome: { type: string }
      responses:
        "201":
          description: Departamento criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /departamentos/{id}:
    put:
      tags: [Departamentos]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
      responses:
        "200":
          description: Departamento atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    delete:
      tags: [Departamentos]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Departamento removido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /conciliacoes:
    get:
      tags: [Conciliacoes]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de conciliações
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /conciliacoes/importar:
    post:
      tags: [Conciliacoes]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Extrato importado para conciliação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /conciliacoes/{id}:
    get:
      tags: [Conciliacoes]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Detalhe da conciliação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
    delete:
      tags: [Conciliacoes]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Conciliação removida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /conciliacoes/{id}/conciliar:
    post:
      tags: [Conciliacoes]
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdPath" }]
      responses:
        "200":
          description: Conciliação finalizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /conciliacoes/{id}/itens/{itemId}/ignorar:
    post:
      tags: [Conciliacoes]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - in: path
          name: itemId
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Item ignorado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeGeneric" }
  /conciliacoes/{id}/itens/{itemId}/vincular:
    post:
      tags: [Conciliacoes]
      security: [{ bearerAuth: [] }]
