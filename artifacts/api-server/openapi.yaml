components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: integer
  responses:
    UnauthorizedError:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelopeError"
    ForbiddenError:
      description: Sem permissão
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiEnvelopeError"
  schemas:
    ApiErrorItem:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: {}
    ApiEnvelopeGeneric:
      type: object
      properties:
        data: {}
        meta:
          nullable: true
          type: object
          additionalProperties: true
        errors:
          nullable: true
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorItem"
    ApiEnvelopePaginated:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeGeneric"
        - type: object
          properties:
            meta:
              type: object
              properties:
                total: { type: integer }
                page: { type: integer }
                limit: { type: integer }
    ApiEnvelopePermissions:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeGeneric"
        - type: object
          properties:
            data:
              type: array
              items:
                type: string
    ApiEnvelopeAuthLogin:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeGeneric"
        - type: object
          properties:
            data:
              type: object
              properties:
                token: { type: string }
                user:
                  $ref: "#/components/schemas/Usuario"
            meta:
              type: object
              properties:
                tokenType: { type: string, example: Bearer }
                expiresIn: { type: string, example: 24h }
    ApiEnvelopeMe:
      allOf:
        - $ref: "#/components/schemas/ApiEnvelopeGeneric"
        - type: object
          properties:
            data:
              type: object
              properties:
                user:
                  $ref: "#/components/schemas/Usuario"
                permissoes:
                  type: array
                  items: { type: string }
    ApiEnvelopeError:
      type: object
      properties:
        data:
          nullable: true
        meta:
          nullable: true
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ApiErrorItem"
    Usuario:
      type: object
      properties:
        id: { type: integer }
        nome: { type: string }
        email: { type: string, format: email }
    UsuarioCreateInput:
      type: object
      required: [nome, email, senha]
      properties:
        nome: { type: string }
        email: { type: string, format: email }
        senha: { type: string }
        telefone: { type: string }
        celular: { type: string }
        bloqueado: { type: boolean }
    ParceiroInput:
      type: object
      properties:
        tipo_pessoa: { type: string, enum: [PF, PJ] }
        cpf_cnpj: { type: string }
        nome: { type: string }
        nome_fantasia: { type: string }
        tipos:
          type: array
          items: { type: string }
        departamento_id: { type: integer, nullable: true }
        centro_custo_id: { type: integer, nullable: true }
        ativo: { type: boolean }
        bloqueado: { type: boolean }
        chaves_pix:
          type: array
          items:
            type: object
            properties:
              tipo: { type: string }
              chave: { type: string }
        dados_bancarios:
          type: array
          items:
            type: object
            properties:
              banco: { type: string }
              agencia: { type: string }
              conta: { type: string }
    LancamentoInput:
      type: object
      required: [tipo, vencimento, valor]
      properties:
        tipo: { type: string, enum: [CP, CR] }
        vencimento: { type: string, format: date }
        competencia: { type: string, format: date }
        conta_id: { type: integer }
        parceiro_id: { type: integer }
        descricao: { type: string }
        valor: { type: number }
        status: { type: string }
        plano_conta_id: { type: integer }
        departamento_id: { type: integer, nullable: true }
        centro_custo_id: { type: integer, nullable: true }
        parcela_atual: { type: integer }
        total_parcelas: { type: integer }
        riscos:
          type: array
          items: { type: string }
    ContaBancariaInput:
      type: object
      properties:
        tipo: { type: string }
        banco: { type: string }
        agencia: { type: string }
        conta: { type: string }
        nome: { type: string }
        empresa: { type: string }
        saldo_inicial: { type: number }
        data_inicio: { type: string, format: date }
        status: { type: string }
        cor: { type: string }
    PlanoContaInput:
      type: object
      properties:
        tipo: { type: string, example: despesa }
        categoria: { type: string }
        subcategoria: { type: string }
        codigo: { type: string }
        ativo: { type: boolean }
