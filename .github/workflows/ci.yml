name: CI

# Barreira de merge e de deploy. Roda em todo PR e é chamado pelo main.yml (job `testes`;
# o deploy só segue com tudo verde). Para BLOQUEAR o merge, marque "Testes unitários",
# "Isolamento entre empresas" e "Banco e e2e" como checks obrigatórios em
# Settings > Branches > regra de proteção de develop/master (não dá para fazer por código).
# Localmente, a bateria completa: pnpm test:all (scripts/test-all.mjs).

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Segredos só de teste, distintos entre si (a API recusa iguais em produção).
  JWT_SECRET: ci-jwt-secret-com-pelo-menos-32-caracteres
  JWT_ENCRYPT_SECRET: ci-jwt-encrypt-secret-distinto-com-32-caracteres

jobs:
  testes-unitarios:
    name: Testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Lockfile congelado: pnpm 10 ou dependência fora do lock reprova aqui.
      - run: pnpm install --frozen-lockfile
      - name: Typecheck, unitários da API e testes do front
        run: node scripts/test-all.mjs --sem-banco

  isolamento:
    name: Isolamento entre empresas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ism_user
          POSTGRES_PASSWORD: ci_bootstrap_pw
          POSTGRES_DB: ismfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ism_user -d ismfinance"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      # Bootstrap (superuser) só para o migrate; a API e os testes ligam como ism_app / ism_admin / ism_owner.
      DATABASE_MIGRATE_URL: postgresql://ism_user:ci_bootstrap_pw@127.0.0.1:5432/ismfinance
      ISM_APP_PASSWORD: ci_app_pw
      ISM_ADMIN_PASSWORD: ci_admin_pw
      ISM_OWNER_PASSWORD: ci_owner_pw
      DATABASE_URL: postgresql://ism_app:ci_app_pw@127.0.0.1:5432/ismfinance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @workspace/api-server...

      - name: Aplicar migrations (cria roles ism_app / ism_admin / ism_owner)
        run: pnpm --filter @workspace/db run db:migrate

      - name: Suíte de isolamento (falha se qualquer rota autenticada vazar dados entre empresas)
        run: pnpm --filter @workspace/api-server run test:isolation

  banco-e2e:
    name: Banco e e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ism_user
          POSTGRES_PASSWORD: ci_bootstrap
          POSTGRES_DB: ismfinance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ism_user -d ismfinance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O isolamento roda no job acima; aqui: migrations 2x, drift, RLS, seed, build e e2e.
      - name: Migrations (2x), drift do schema, RLS, seed, build da API e e2e
        run: node scripts/test-all.mjs --sem-unitarios --sem-isolamento
        env:
          TEST_PG_URL: postgresql://ism_user:ci_bootstrap@127.0.0.1:5432/ismfinance
