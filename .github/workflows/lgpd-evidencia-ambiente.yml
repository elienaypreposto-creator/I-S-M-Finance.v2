name: Evidencia LGPD ambiente

on:
  workflow_dispatch:

jobs:
  evidencia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # v1.0.3 não tem script_path: o run 37982854289 ignorou o ficheiro,
      # executou um comando vazio e terminou verde.
      - name: DPA, export, eliminacao e chave LUKS na VM
        id: vm
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 20m
          script_path: scripts/lgpd-evidencia-ambiente.sh
          capture_stdout: true

      - name: Gravar log da VM
        if: always()
        env:
          VM_LOG: ${{ steps.vm.outputs.stdout }}
        run: |
          mkdir -p evidencia
          printf '%s\n' "$VM_LOG" > evidencia/vm.log

      - name: Publicar evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lgpd-evidencia-vm
          path: evidencia/vm.log
          if-no-files-found: error

      - name: Exigir os três marcadores
        run: |
          set -euo pipefail
          log=evidencia/vm.log
          grep -q "EXPORT_DOWNLOAD_HTTP=200" "$log"
          grep -q "DELETE_HTTP=200" "$log"
          grep -q "DELETE_ELIMINADA=1" "$log"
          test "$(grep -c 'LUKS_KEY_IGUAL_OWNER=0' "$log")" -ge 2
          grep -q "filial-sul-teste" "$log"
          grep -q "EVIDENCIA_FIM falha=0" "$log"
