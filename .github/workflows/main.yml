name: Deploy ISM Finance

on:
  push:
    branches:
      - master
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # master -> HML, develop -> TST. Variáveis e secrets usam o prefixo do ambiente (ex.: HML_DB_PORT).
      TARGET_DIR: ${{ github.ref_name == 'master' && 'ism-hml' || 'ism-tst' }}
      PORT: ${{ vars[format('{0}_PORT', github.ref_name == 'master' && 'HML' || 'TST')] }}
      WEB_PORT: ${{ vars[format('{0}_WEB_PORT', github.ref_name == 'master' && 'HML' || 'TST')] }}
      API_PORT: ${{ vars[format('{0}_API_PORT', github.ref_name == 'master' && 'HML' || 'TST')] }}
      DB_PORT: ${{ vars[format('{0}_DB_PORT', github.ref_name == 'master' && 'HML' || 'TST')] }}
      SMTP_HOST: ${{ vars[format('{0}_SMTP_HOST', github.ref_name == 'master' && 'HML' || 'TST')] }}
      SMTP_PORT: ${{ vars[format('{0}_SMTP_PORT', github.ref_name == 'master' && 'HML' || 'TST')] }}
      SMTP_USER: ${{ vars[format('{0}_SMTP_USER', github.ref_name == 'master' && 'HML' || 'TST')] }}
      DB_PASSWORD: ${{ secrets[format('{0}_DB_PASSWORD', github.ref_name == 'master' && 'HML' || 'TST')] }}
      ISM_APP_PASSWORD: ${{ secrets[format('{0}_ISM_APP_PASSWORD', github.ref_name == 'master' && 'HML' || 'TST')] }}
      ISM_ADMIN_PASSWORD: ${{ secrets[format('{0}_ISM_ADMIN_PASSWORD', github.ref_name == 'master' && 'HML' || 'TST')] }}
      ISM_OWNER_PASSWORD: ${{ secrets[format('{0}_ISM_OWNER_PASSWORD', github.ref_name == 'master' && 'HML' || 'TST')] }}
      JWT_SECRET: ${{ secrets[format('{0}_JWT_SECRET', github.ref_name == 'master' && 'HML' || 'TST')] }}
      JWT_ENCRYPT_SECRET: ${{ secrets[format('{0}_JWT_ENCRYPT_SECRET', github.ref_name == 'master' && 'HML' || 'TST')] }}
      SMTP_PASS: ${{ secrets[format('{0}_SMTP_PASS', github.ref_name == 'master' && 'HML' || 'TST')] }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      LUKS_PASSPHRASE: ${{ secrets[format('{0}_LUKS_PASSPHRASE', github.ref_name == 'master' && 'HML' || 'TST')] }}
    steps:
      - name: Validar variáveis do ambiente
        run: |
          faltando=0
          for v in PORT WEB_PORT API_PORT DB_PORT SMTP_HOST SMTP_PORT SMTP_USER DB_PASSWORD JWT_SECRET JWT_ENCRYPT_SECRET SMTP_PASS REDIS_PASSWORD LUKS_PASSPHRASE; do
            if [ -z "${!v}" ]; then
              echo "::error::$v não definida para $TARGET_DIR"
              faltando=1
            fi
          done
          if [ -z "$ISM_APP_PASSWORD" ] || [ -z "$ISM_ADMIN_PASSWORD" ] || [ -z "$ISM_OWNER_PASSWORD" ]; then
            echo "::warning::Defina TST_/HML_ISM_APP_PASSWORD, ISM_ADMIN_PASSWORD e ISM_OWNER_PASSWORD. A usar DB_PASSWORD até existirem."
          fi
          {
            echo "ISM_APP_PASSWORD=${ISM_APP_PASSWORD:-$DB_PASSWORD}"
            echo "ISM_ADMIN_PASSWORD=${ISM_ADMIN_PASSWORD:-$DB_PASSWORD}"
            echo "ISM_OWNER_PASSWORD=${ISM_OWNER_PASSWORD:-$DB_PASSWORD}"
          } >> "$GITHUB_ENV"
          exit $faltando

      - name: Executando deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          envs: TARGET_DIR,PORT,WEB_PORT,API_PORT,DB_PORT,SMTP_HOST,SMTP_PORT,SMTP_USER,DB_PASSWORD,ISM_APP_PASSWORD,ISM_ADMIN_PASSWORD,ISM_OWNER_PASSWORD,JWT_SECRET,JWT_ENCRYPT_SECRET,SMTP_PASS,REDIS_PASSWORD,LUKS_PASSPHRASE
          script: |
            set -e
            echo "Iniciando deploy no diretório: $TARGET_DIR para a branch: ${{ github.ref_name }}"

            cd "$HOME/$TARGET_DIR"

            git fetch --all
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            umask 077
            printf '%s\n' \
              "PORT=$PORT" \
              "WEB_PORT=$WEB_PORT" \
              "API_PORT=$API_PORT" \
              "DB_PORT=$DB_PORT" \
              "DB_PASSWORD=$DB_PASSWORD" \
              "ISM_APP_PASSWORD=$ISM_APP_PASSWORD" \
              "ISM_ADMIN_PASSWORD=$ISM_ADMIN_PASSWORD" \
              "ISM_OWNER_PASSWORD=$ISM_OWNER_PASSWORD" \
              "JWT_SECRET=$JWT_SECRET" \
              "JWT_ENCRYPT_SECRET=$JWT_ENCRYPT_SECRET" \
              "SMTP_HOST=$SMTP_HOST" \
              "SMTP_PORT=$SMTP_PORT" \
              "SMTP_USER=$SMTP_USER" \
              "SMTP_PASS=$SMTP_PASS" \
              "REDIS_PASSWORD=$REDIS_PASSWORD" \
              > .env
            chmod 600 .env

            if [ -z "${LUKS_PASSPHRASE:-}" ]; then
              echo "LUKS_PASSPHRASE ausente. O unlock do volume não usa senha do banco."
              exit 1
            fi
            if [ "$LUKS_PASSPHRASE" = "$ISM_OWNER_PASSWORD" ] || [ "$LUKS_PASSPHRASE" = "$DB_PASSWORD" ]; then
              echo "LUKS_PASSPHRASE não pode repetir ISM_OWNER_PASSWORD nem DB_PASSWORD."
              exit 1
            fi
            export PG_LUKS_PASSPHRASE="$LUKS_PASSPHRASE"
            eval "$(bash scripts/lgpd-volume-luks.sh | tee /dev/stderr | grep '^PGDATA_MOUNT=')"
            if [ -z "${PGDATA_MOUNT:-}" ]; then
              echo "Volume LUKS não devolveu PGDATA_MOUNT. Deploy interrompido."
              exit 1
            fi
            printf '%s\n' "ISM_DISCO_CIFRADO=1" "PGDATA_MOUNT=$PGDATA_MOUNT" >> .env

            docker compose up -d postgres
            echo "Aguardando postgres aceitar conexões..."
            pronto=0
            for i in $(seq 1 30); do
              if docker compose exec -T postgres pg_isready -U ism_user -d ismfinance >/dev/null 2>&1; then
                pronto=1
                break
              fi
              sleep 2
            done
            if [ "$pronto" -ne 1 ]; then
              echo "PostgreSQL não ficou pronto. Backup e migrations interrompidos."
              exit 1
            fi

            export BACKUP_CIPHER_PASS="${ISM_OWNER_PASSWORD:-$DB_PASSWORD}"
            bash scripts/lgpd-cifrar-backup.sh

            docker compose build api

            echo "Aplicando migrations versionadas (sem drizzle-kit push)..."
            docker compose run --rm --no-deps \
              -e DATABASE_MIGRATE_URL="postgresql://ism_user:${DB_PASSWORD}@postgres:5432/ismfinance" \
              api pnpm --filter @workspace/db run db:migrate

            docker compose up -d --build
