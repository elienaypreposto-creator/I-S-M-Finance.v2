server {
    listen 80;
    server_name localhost;

    # Onde os arquivos do frontend ficarão
    root /usr/share/nginx/html;
    index index.html;

    # Proxy reverso para a API (backend)
    location /api/ {
        proxy_pass http://api:5000; # Redireciona tudo que for /api para o serviço "api"
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Repassa o IP real para os logs da API
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Fallback (todas as outras requisições caem no index.html do React/Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desativar logs desnecessários para assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }
}
