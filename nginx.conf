server {
    listen 80;
    server_name localhost;

    # Onde os arquivos do frontend ficarão
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Headers de segurança (ISMF-2 / ISMF-5). O TLS termina no nginx de borda, mas o
    # navegador só fala HTTPS com o ISM, então o HSTS sai daqui e atravessa a borda.
    # Valem para todas as locations abaixo (nenhuma tem add_header próprio, senão
    # deixariam de herdar). "always" cobre também 4xx/5xx.
    # CSP: build do Vite não tem script inline; estilos inline vêm de libs de UI;
    # fonte Inter vem do Google Fonts; blob:/data: para export (PDF/XLSX) e imagens.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Proxy reverso para a API (backend)
    location /api/ {
        # A API manda os mesmos headers; esconde os dela para não sair valor duplicado.
        proxy_hide_header X-Powered-By;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Content-Security-Policy;

        # Teto do corpo da requisição. A API limita o OFX a 10 MB (multer) e o JSON a 100kb;
        # 11m dá folga para o overhead do multipart, de modo que o erro 413 amigável venha da
        # API e não do nginx (o default do nginx é 1m, o que barraria OFX maiores que 1 MB).
        client_max_body_size 11m;

        proxy_pass http://api:5000; # Redireciona tudo que for /api para o serviço "api"
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # IP real: a borda grava X-Forwarded-For com o IP do cliente e este nginx
        # ACRESCENTA o seu $remote_addr (gateway do docker-proxy). A API confia em
        # exatamente 2 saltos (TRUST_PROXY_HOPS, default 2) - não trocar por
        # $remote_addr nem remover o append, senão req.ip vira o gateway.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Fallback (todas as outras requisições caem no index.html do React/Vite)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desativar logs desnecessários para assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
    }
}